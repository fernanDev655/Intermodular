<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Administrador - AutoElite</title>
    <link rel="stylesheet" href="/css/admin.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
<base target="_blank">
</head>
<body>

    <div class="admin-layout">

        <!-- ==========================================
             SIDEBAR
             ========================================== -->
        <aside class="admin-sidebar">
            <div class="sidebar-brand">
                <a href="index.html">
                    <span class="light">AUTO</span><span class="gold">ELITE</span>
                </a>
            </div>

            <div class="sidebar-title">Panel Administrador</div>

            <ul class="sidebar-nav">
                <li class="active">
                    <a href="#usuarios" onclick="mostrarSeccion('usuarios')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        Usuarios
                    </a>
                </li>
                <li>
                    <a href="#" onclick="accederComoComercial(); return false;" class="nav-link-comercial">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                        </svg>
                        Vista Comercial
                    </a>
                </li>
                <li>
                    <a href="/concesionario/coleccion.html">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="1" y="3" width="15" height="13" rx="2"></rect>
                            <path d="M16 8h4l3 5v3h-7V8z"></path>
                            <circle cx="5.5" cy="18.5" r="2.5"></circle>
                            <circle cx="18.5" cy="18.5" r="2.5"></circle>
                        </svg>
                        Colección
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <button onclick="logout()" class="btn-logout-sidebar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Cerrar Sesión
                </button>
            </div>
        </aside>

        <!-- ==========================================
             MAIN CONTENT
             ========================================== -->
        <main class="admin-main">

            <!-- HEADER -->
            <header class="admin-header">
                <div class="header-title">
                    <h1>Panel de Administración</h1>
                    <p>Gestión de usuarios del concesionario</p>
                </div>
                <div class="user-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span id="userName">Admin</span>
                </div>
            </header>

            <!-- CONTENT -->
            <div class="admin-content">

                <!-- ==========================================
                     SECCIÓN: USUARIOS
                     ========================================== -->
                <section id="seccion-usuarios" class="section-card">
                    <div class="section-header">
                        <h2>
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                            Gestión de Usuarios
                        </h2>
                        <button onclick="abrirModalCrear()" class="btn btn-primary btn-crear-usuario">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            Nuevo Usuario
                        </button>
                    </div>
                    <div class="table-container">
                        <table id="tablaUsuarios">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Apellidos</th>
                                    <th>DNI</th>
                                    <th>Teléfono</th>
                                    <th>Email</th>
                                    <th>Rol</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </section>

            </div>
        </main>
    </div>

    <!-- ==========================================
         MODAL EDITAR USUARIO
         ========================================== -->
    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Usuario</h3>
                <button onclick="cerrarModalEditar()" class="btn-close">&times;</button>
            </div>
            <form id="formEditarUsuario">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="editNombre" required />
                </div>
                <div class="form-group">
                    <label>Apellidos</label>
                    <input type="text" id="editApellidos" />
                </div>
                <div class="form-group">
                    <label>DNI</label>
                    <input type="text" id="editDni" />
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="tel" id="editTelefono" />
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="editEmail" required />
                </div>
                <div class="form-group">
                    <label>Rol</label>
                    <select id="editRole" required>
                        <option value="USER">Cliente</option>
                        <option value="COMERCIAL">Comercial</option>
                        <option value="ADMIN">Administrador</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" onclick="cerrarModalEditar()" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ==========================================
         MODAL CREAR USUARIO
         ========================================== -->
    <div id="modalCrear" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Nuevo Usuario</h3>
                <button onclick="cerrarModalCrear()" class="btn-close">&times;</button>
            </div>
            <form id="formCrearUsuario">
                <!-- Barra de progreso -->
                <div id="crearProgress" style="height:3px;background:rgba(212,175,55,0.1);border-radius:2px;margin-bottom:1.25rem;overflow:hidden;">
                    <div id="crearProgressBar" style="height:100%;background:linear-gradient(90deg,#c9a962,#e8c96a);border-radius:2px;transition:width 0.4s ease;width:0%;"></div>
                </div>
                <div class="form-group">
                    <label>Nombre *</label>
                    <input type="text" id="crearNombre" required />
                </div>
                <div class="form-group">
                    <label>Apellidos</label>
                    <input type="text" id="crearApellidos" />
                </div>
                <div class="form-group">
                    <label>DNI</label>
                    <input type="text" id="crearDni" />
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="tel" id="crearTelefono" />
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="crearEmail" required />
                </div>
                <div class="form-group">
                    <label>Contraseña *</label>
                    <input type="password" id="crearPassword" required minlength="6" />
                </div>
                <div class="form-group">
                    <label>Rol</label>
                    <select id="crearRole" required>
                        <option value="USER">Cliente</option>
                        <option value="MECANICO">Mecánico</option>
                        <option value="COMERCIAL">Comercial</option>
                        <option value="ADMIN">Administrador</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" onclick="cerrarModalCrear()" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Crear Usuario</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>
