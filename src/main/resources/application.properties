spring.application.name=concesionario
server.port=8088

# === CONEXIÓN A BASE DE DATOS (phpMyAdmin / MariaDB) ===
# Importa el archivo concesionario (1).sql en phpMyAdmin antes de arrancar
spring.datasource.url=jdbc:mysql://localhost:3306/concesionario?useSSL=false&serverTimezone=Europe/Madrid&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jackson.property-naming-strategy=SNAKE_CASE
server.error.whitelabel.enabled=false
